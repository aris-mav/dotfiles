shell fish
shell_integration enabled

allow_remote_control yes
listen_on unix:/tmp/kitty

enable_audio_bell no

text_composition_strategy legacy

# Font
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.0

cursor_shape_unfocused hollow
cursor_blink_interval 0 linear ease-out

scrollback_lines 3000

# Window
remember_window_size  yes
hide_window_decorations yes
window_padding_width  5

startup_session none

background_opacity 1.0

active_border_color none
inactive_border_color #000000

tab_bar_style separator
tab_separator " "
tab_bar_background none
tab_title_template "{index}:{title}"
active_tab_title_template "[{index}:{title}]"
active_tab_font_style   bold
inactive_tab_font_style normal

map alt+h neighboring_window left
map alt+l neighboring_window right
map alt+k neighboring_window up
map alt+j neighboring_window down

map alt+shift+h move_window left
map alt+shift+l move_window right
map alt+shift+k move_window up
map alt+shift+j move_window down

map alt+equal resize_window wider 2
map alt+minus resize_window narrower 2
map alt+shift+equal resize_window taller 2
map alt+shift+minus resize_window shorter 2

map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9

enabled_layouts splits,stack
window_border_width 0

map alt+t set_window_title

map --allow-fallback=shifted,ascii ctrl+shift+e open_url_with_hints

# https://sw.kovidgoyal.net/kitty/conf/#select-and-act-on-visible-text
action_alias myhints kitten hints --alphabet qfjdkslaureitywovmcxzpq1234567890
map --allow-fallback=shifted,ascii ctrl+shift+p>shift+f myhints --type path
map --allow-fallback=shifted,ascii ctrl+shift+p>f myhints --type path --program -
map --allow-fallback=shifted,ascii ctrl+shift+p>l myhints --type line --program -
map --allow-fallback=shifted,ascii ctrl+shift+p>w myhints --type word --program -
map --allow-fallback=shifted,ascii ctrl+shift+p>h myhints --type hash --program -
map --allow-fallback=shifted,ascii ctrl+shift+p>y myhints --type hyperlink
map --allow-fallback=shifted,ascii ctrl+shift+p>n myhints --type --type=linenum --linenum-action=tab nvim +{line} {path}
map --allow-fallback=shifted,ascii ctrl+shift+p>shift+n myhints --type --type=linenum --linenum-action=os_window nvim +{line} {path}

scrollback_pager env KITTY_SCROLLBACK_PAGER=1 nvim +'call nvim_open_term(0, {})' +'set readonly nolist' +'$' -
map alt+; show_scrollback
