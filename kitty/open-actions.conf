# this file determines how hyperlinks are opened
# https://sw.kovidgoyal.net/kitty/open_actions/
 
protocol file
ext md
action launch --type=tab --cwd=current -- mdcat --paginate -- ${FILE_PATH}

protocol file
mime text/*
fragment_matches [0-9]+
action launch --type=tab --cwd=current ${EDITOR} +${FRAGMENT} -- ${FILE_PATH}
